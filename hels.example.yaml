version: 1

project:
  name: mi-servicio
  description: "Ejemplo generado por 'hels init'"

environments:
  dev:
    engine: floci
    region: us-east-1
    account_id: "000000000000"
    port: 4566
    storage:
      mode: memory
    services:
      - s3
      - lambda
      - dynamodb

# "hels dashboard" arranca cada uno de estos procesos solo y muestra su
# salida en vivo junto a los servicios de floci — el gateway (KrakenD o el
# que sea), el frontend, un worker, lo que necesites correr en paralelo.
# Descomentá y ajustá:
#
# processes:
#   gateway:
#     cmd: krakend run -c krakend.json
#     dir: ./gateway
#   frontend:
#     cmd: npm run dev
#     dir: ./frontend
